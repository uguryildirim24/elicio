[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elicio"
version = "0.1.0"
description = "An unfinished ear-muscle EMG earpiece with a synthetic gesture-to-action gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
research = [
  "scikit-learn>=1.5",
  "torch>=2.4",
  "wfdb>=4.1",
]
cad = [
  # Order-1 STEP/STL/3MF bytes depend on the CAD kernel and tessellator.
  "build123d==0.11.1",
  "cadquery-ocp-novtk==7.9.3.1.1",
  "trimesh>=4",
  "matplotlib>=3.9",
  "pypdf>=5",
]
ble = [
  "bleak>=0.22",
]
# Phone sheets, the placement drawings and their tests without the CAD kernel.
sheets = [
  "matplotlib>=3.9",
  "pypdf>=5",
]

[project.scripts]
elicio = "elicio.cli:main"
elicio-emg = "elicio.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"elicio.pipeline" = ["README.md"]
